<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3e9">
<meta name="description" content="Convite de casamento de Belita & Theodor">
<title>Belita &amp; Theodor | Convite de Casamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#b18a35;--ivory:#f7f3e9;--ink:#383225}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--ivory);scroll-padding-top:0}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;overflow:hidden}
body.invitation-open{overflow-x:hidden;overflow-y:auto}
.cover{position:fixed;inset:0;z-index:1000;width:100%;height:100vh;height:100svh;min-height:100vh;min-height:100svh;margin:0;padding:0;display:grid;place-items:center;overflow:hidden;background:#eee7d9;perspective:1400px}
.cover-button{position:absolute;inset:0;display:block;width:100%;height:100%;padding:0;margin:0;border:0;background:transparent;cursor:pointer;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.72,.18,1),opacity .8s ease;overflow:hidden;-webkit-tap-highlight-color:transparent}
.cover-button img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}
.cover-button:focus-visible{outline:3px solid var(--gold);outline-offset:-7px}
.seal-pulse{position:absolute;width:21%;aspect-ratio:1;left:48%;top:72%;border:1px solid #f5df9a;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 0 #c9a24b77;animation:pulse 2s infinite;pointer-events:none}
@keyframes pulse{70%{box-shadow:0 0 0 13px #c9a24b00}100%{box-shadow:0 0 0 0 #c9a24b00}}
.cover-hint{position:absolute;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));text-align:center;color:#80632b;font:600 10px Arial,sans-serif;letter-spacing:.2em;text-shadow:0 1px 5px #fff,0 0 9px #fff;pointer-events:none}
.cover.opening .cover-button{transform:rotateX(78deg) scale(.94) translateY(-25px);opacity:0;pointer-events:none}
.invitation{display:block;position:relative;width:100%;max-width:760px;margin:0 auto;background:#fff;opacity:1;visibility:visible}
@keyframes appear{to{opacity:1}}
.blessing{position:relative;margin:0;padding:clamp(24px,5vw,42px) 14px 12px;text-align:center;background:#fff;color:#29251e;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(21px,4.6vw,31px);font-weight:500;line-height:1.15;letter-spacing:.035em}
.blessing:after{content:"";display:block;width:min(34%,150px);height:1px;margin:17px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.artwork{display:block;width:100%;height:auto;margin:0}
.confirm-area{padding:28px 18px max(38px,env(safe-area-inset-bottom));text-align:center;background:#fffdf8}
.confirm{display:inline-flex;align-items:center;justify-content:center;min-height:56px;width:min(100%,470px);padding:15px 22px;border-radius:999px;background:linear-gradient(135deg,#8d6925,#d4b66c,#94702c);color:white;text-decoration:none;text-transform:uppercase;letter-spacing:.12em;font:600 12px/1.4 Arial,sans-serif;box-shadow:0 9px 22px #77591e33;transition:transform .2s,filter .2s}
.confirm:hover{transform:translateY(-2px);filter:brightness(1.06)}
.confirm:focus-visible{outline:3px solid #322715;outline-offset:4px}
.small{margin:13px 0 0;color:#82775e;font:11px Arial,sans-serif;letter-spacing:.08em}
@media(min-width:760px){.cover-button img{object-fit:contain;background:#eee7d9}.invitation{box-shadow:0 0 50px #4c3b1d18}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<section class="cover" id="cover" aria-label="Envelope do convite">
<button class="cover-button" id="openSeal" type="button" aria-label="Tocar no selo B e T para abrir o convite">
<img src="assets/envelope-cover.jpg" alt="Envelope marfim com data em relevo e selo dourado B&T">
<span class="seal-pulse" aria-hidden="true"></span>
<span class="cover-hint">TOQUE NO SELO B&amp;T PARA ABRIR</span>
</button>
</section>
<article class="invitation" id="invitation" aria-label="Convite de casamento de Belita e Theodor">
<header class="blessing" id="firstWords">Com a Bênção de Deus e de seus Pais</header>
<img id="invitationArtwork" class="artwork" src="assets/convite-atualizado.jpg" alt="Convite de casamento de Belita e Theodor, com os nomes, calendário, programa e versículo Zacarias 2:5">
<div class="confirm-area">
<a class="confirm" href="https://convitin.com.br/matrimonio-3/" target="_blank" rel="noopener noreferrer">Clique aqui para confirmar a presença</a>
<p class="small">BELITA &amp; THEODOR · 18 DE DEZEMBRO DE 2026</p>
</div>
</article>
</main>
<script>
const cover = document.getElementById('cover');
const opener = document.getElementById('openSeal');
const firstWords = document.getElementById('firstWords');

opener.addEventListener('click', () => {
  if (opener.disabled) return;
  opener.disabled = true;
  cover.classList.add('opening');

  // The invitation is already positioned at document y=0, underneath
  // the fixed envelope. Removing the overlay reveals the first words
  // immediately; no initial scroll is required from the visitor.
  window.setTimeout(() => {
    cover.remove();
    document.body.classList.add('invitation-open');
    document.documentElement.style.scrollBehavior = 'auto';
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;

    // Keep the blessing at the very top even on mobile browsers that
    // restore a previous scroll offset after an overlay is dismissed.
    requestAnimationFrame(() => {
      window.scrollTo(0, 0);
      firstWords.scrollIntoView({ block: 'start', behavior: 'auto' });
      window.scrollTo(0, 0);
    });
  }, 780);
});
</script>
</body>
</html>
